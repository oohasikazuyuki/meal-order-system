name: Deploy to Dev

# main に入ったものを Dev環境へ反映する。
# 手元でビルドして転送する作業（クロスビルド + docker save + ssh）を置き換える。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # 続けてマージされたとき、古いデプロイが新しいものを上書きしないようにする
  group: deploy-dev
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: イメージをビルドして GHCR へ
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dev環境は AMD の無料枠インスタンス。手元(arm64)とアーキテクチャが違う
      - name: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/backend:dev
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # NEXT_PUBLIC_* はビルド時に焼き込まれる。実行時の環境変数では変えられない
      - name: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:dev
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PUBLIC_BASE_URL }}/api
            NEXT_PUBLIC_AI_PUBLIC_ENABLED=true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Dev環境へ反映
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH鍵を用意
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # サーバーの docker-compose.yml は、setup-https.sh が 443番と証明書の
      # マウントを書き足した状態になっている。リポジトリの素のファイルで
      # 上書きすると HTTPS が消えてサイトごと落ちる（実際に落とした）。
      # 送ったあとに同じ書き足しをやり直す。
      - name: compose 定義を揃える
        uses: actions/checkout@v4

      - name: compose をサーバーへ送り、HTTPS設定を入れ直す
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy "$TARGET" 'mkdir -p ~/meal-order/deploy'
          scp -i ~/.ssh/deploy docker-compose.micro.yml "$TARGET:~/meal-order/docker-compose.yml"
          # 書き足しスクリプト自体も送る。送らないとサーバー側が古いまま直らない
          scp -i ~/.ssh/deploy deploy/apply-https-to-compose.sh "$TARGET:~/meal-order/deploy/"
          ssh -i ~/.ssh/deploy "$TARGET" 'cd ~/meal-order && bash deploy/apply-https-to-compose.sh'

      - name: 新しいイメージに入れ替えて起動
        run: |
          ssh -i ~/.ssh/deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/meal-order

          echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          sudo docker pull ${{ env.IMAGE_PREFIX }}/backend:dev
          sudo docker pull ${{ env.IMAGE_PREFIX }}/frontend:dev
          sudo docker tag  ${{ env.IMAGE_PREFIX }}/backend:dev  meal-dev-backend:amd64
          sudo docker tag  ${{ env.IMAGE_PREFIX }}/frontend:dev meal-dev-frontend:amd64

          sudo docker compose up -d

          # up -d は中身の変わったコンテナしか作り直さないので nginx は据え置かれる。
          # だが backend/frontend は作り直されて別IPになり、nginx は起動時に
          # 解決した古いIPを掴んだままになる（= APIが502のまま）。
          sudo docker compose restart nginx

          sudo docker compose exec -T backend php migrate.php

          # 入れ替え前の古いイメージがディスクに溜まる。48GBしかない
          sudo docker image prune -f
          REMOTE

      - name: 動いているか確かめる
        run: |
          # 起動直後は 502 になることがあるので少し待つ
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ secrets.PUBLIC_BASE_URL }}/login" || echo 000)
            api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ secrets.PUBLIC_BASE_URL }}/api/blocks" || echo 000)
            echo "  試行 $i: ログイン画面=$code API=$api"
            if [ "$code" = "200" ] && [ "$api" = "200" ]; then
              echo "デプロイ成功"
              exit 0
            fi
            sleep 10
          done
          echo "::error::デプロイ後の確認に失敗しました"
          exit 1
