# メモリ 1GB の機械（VM.Standard.E2.1.Micro）向け。
# docker-compose.prod.yml との違いは、MySQL に与えるメモリを絞ることと、
# イメージを手元でクロスビルドして持ち込む前提にしていること。
#
# 1GB しかないので、MySQL に 256M のバッファプールを与えると
# 他が入らなくなる。Dev用途ならデータ量も小さいので 64M で足りる。

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks: [meal_network]

  backend:
    image: meal-dev-backend:amd64
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEBUG: "false"
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      SECURITY_SALT: ${SECURITY_SALT:?SECURITY_SALT を .env に設定してください}
      AI_PUBLIC_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    networks: [meal_network]

  frontend:
    image: meal-dev-frontend:amd64
    restart: unless-stopped
    networks: [meal_network]

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Tokyo
    # 1GB機なのでバッファプールを絞る。performance_schema も切って数十MB稼ぐ
    command: >
      --innodb-buffer-pool-size=64M
      --performance-schema=OFF
      --innodb-log-buffer-size=8M
      --max-connections=30
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [meal_network]

networks:
  meal_network:
    driver: bridge

volumes:
  db_data:
